services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: advisor_crm_demo
      POSTGRES_USER: postgres
      # Local-only throwaway password for this disposable demo container.
      # Not used anywhere else, not a real credential.
      POSTGRES_PASSWORD: local_demo_only
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
